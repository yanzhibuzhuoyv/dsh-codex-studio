name: Build Windows portable

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-win-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # electron@44 no longer downloads its binary from a postinstall script; the
      # explicit installer is what populates node_modules/electron/dist, which
      # electron-builder reuses via the "electronDist" setting in package.json.
      - name: Install Electron binary
        run: npx --no-install install-electron

      - name: Syntax check
        run: |
          node --check src/main.js
          node --check src/preload.js
          node --check public/renderer.js

      - name: Build portable Windows app
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload portable exe
        uses: actions/upload-artifact@v4
        with:
          name: dsh-codex-studio-portable
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
